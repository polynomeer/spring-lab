# 저장된 시나리오 정의(docs/plan/04-dynamic-scenario-design.md)를 담는 파일 모드 H2.
# 작업 디렉터리는 저장소 루트로 고정돼 있다(build.gradle.kts의 run 태스크 workingDir 설정,
# 그리고 run.sh가 항상 저장소 루트에서 ./gradlew를 호출한다) - 그래서 이 상대 경로가
# 항상 <repoRoot>/build/dashboard-db/를 가리킨다. build/는 .gitignore에 이미 걸려 있다.
spring.datasource.url=jdbc:h2:file:./build/dashboard-db/dashboard;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 별도 마이그레이션 도구(Flyway 등)를 쓰기엔 테이블 하나짜리 로컬 개발 도구라 과하다 -
# 엔티티 변경분을 재기동 시 스스로 반영하게 둔다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# docs/plan/04-dynamic-scenario-design.md 1번/5번 절 - 이 도구는 브라우저에서 받은 코드를
# 서버에서 컴파일·실행한다(2단계). "localhost 밖에 노출하지 않는다"는 전제를 설정으로도
# 강제해 둔다 - 협상 가능한 옵션이 아니라 코드로 못 박아 둔 제약이다.
server.address=127.0.0.1
